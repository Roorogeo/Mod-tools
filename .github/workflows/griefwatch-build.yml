name: Build GriefWatch

on:
  push:
    paths:
      - 'griefwatch/**'
      - '.github/workflows/griefwatch-build.yml'
  pull_request:
    paths:
      - 'griefwatch/**'
      - '.github/workflows/griefwatch-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: griefwatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: griefwatch-jar
          path: |
            griefwatch/build/libs/*.jar
            !griefwatch/build/libs/*-sources.jar
