name: Build GriefWatch

on:
  push:
    paths:
      - 'griefwatch/**'
      - '.github/workflows/griefwatch-build.yml'
  pull_request:
    paths:
      - 'griefwatch/**'
      - '.github/workflows/griefwatch-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: griefwatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: griefwatch-jar
          path: |
            griefwatch/build/libs/*.jar
            !griefwatch/build/libs/*-sources.jar

  # Boots a real dedicated server with the mod so a mixin that no longer matches
  # the game fails here instead of on someone's server.
  server-smoke-test:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: griefwatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot server
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n' > run/server.properties
          ./gradlew runServer --no-daemon > server-console.log 2>&1 &
          ok=0
          for i in $(seq 1 120); do
            if grep -q "Done (" run/logs/latest.log 2>/dev/null; then ok=1; break; fi
            if grep -qE "MixinApplyError|InvalidInjectionException|InvalidMixinException|Crash report|Failed to start the minecraft server" server-console.log run/logs/latest.log 2>/dev/null; then break; fi
            sleep 5
          done
          sleep 3
          echo "----- server log -----"; cat run/logs/latest.log 2>/dev/null | tail -150
          echo "----- console (tail) -----"; tail -80 server-console.log
          pkill -f runServer || true; pkill -f "net.fabricmc.devlaunchinjector" || true; pkill -f KnotServer || true
          grep -q "\[GriefWatch\] Active" run/logs/latest.log || { echo "GriefWatch did not report Active"; exit 1; }
          grep -q "\[GriefWatch\] Hooks applied" run/logs/latest.log || { echo "GriefWatch hooks did not load"; exit 1; }
          if grep -qE "\[GriefWatch\].*(ERROR|Error)|MixinApplyError|InvalidInjectionException" run/logs/latest.log; then echo "Errors in log"; exit 1; fi
          [ "$ok" = 1 ] || { echo "Server did not finish starting"; exit 1; }
          echo "Server booted with GriefWatch."
